project:
  type: website
  title: "V2V Hub"
  output-dir: docs
  # Drop the Source Sans Pro faces Quarto's revealjs theme embeds in every deck and the AURA
  # theme never uses (about 3 MB a deck, more than half the Pages artifact; 2026-11-06).
  post-render:
    - decks/strip-unused-fonts.ts
    # Downloaded files (the resources: below) are opened from a student's own computer, where a
    # relative link opens nothing: give every link in them a full address (2026-11-10).
    - tools/absolute-download-links.ts
    # The course layer (2026-11-14, owner q-20261114-0005): course bar, breadcrumb, phone steps
    # list, tab titles, the course homes' week lists, and the Pagefind search index. Runs last,
    # because it reads the rendered syllabus and slide index.
    - tools/course-layer.ts
  render:
    - "*.qmd"
    # Course homes (2026-11-14): the front door for each course.
    - "mc451/*.qmd"
    - "mc501/*.qmd"
    # about.qmd is unpublished (2026-10-20): an unlinked bio page. Source kept, excluded from render.
    - "!about.qmd"
    - "modules/**/*.qmd"
    - "!modules/**/pokemon-practice.qmd"
    - "resources/*.qmd"
    # Risks guides for the three R worksheets (2026-10-22): static code only, no R chunks, so CI renders them.
    - "resources/risks/*.qmd"
    # Help pages for the three R worksheets (2026-11-11): the help that used to sit inside each worksheet. Static, no R chunks.
    - "resources/help/*.qmd"
    # R cheat sheets (2026-11-05): one page per package, static code only with pasted real output, so CI renders them.
    - "resources/cheat-sheets/*.qmd"
    # Step-by-step guides, one set per course; the Markdown source lives in each teaching workspace on O:.
    - "guides/**/*.md"
    - "workbook/*.qmd"
    - "decks/**/*.qmd"
    # Ungraded weekly self-checks on key terms, linked from the decks (2026-10-22).
    - "self-checks/*.qmd"
    # Starter files are handed to students as SOURCE, never built. Listing them under
    # resources: below is not enough on its own - Quarto still picks a .qmd up as a
    # render target, tries the knitr engine on its R chunks, and the CI runner has no
    # R installed. Build failed exactly that way 2026-09-01.
    - "!starters/*.qmd"
    # Codebook templates are handed over as source like the starters (2026-10-20).
    - "!resources/templates/*.qmd"
  resources:
    - "modules/04_analyst/pokemon-practice.qmd"
    # Starter files students DOWNLOAD and open in VS Code. Deliberately outside the
    # render list above: they are source to be handed over, not pages to be built.
    - "starters/*.qmd"
    # The AI-use log students download and submit with every assignment (2026-10-17). Blackboard links
    # its published URL directly, so it stays served even if a page link to it changes.
    - "resources/MC451-501-AI-use-log.docx"
    - "resources/AI-use-log.docx"
    # Codebook templates students download (2026-10-20): source to hand over, never rendered.
    - "resources/templates/*"
    # VR codebook worked example downloads (2026-10-21): the walkthrough decks link these.
    - "examples/vr-codebook/files/*"
    # Printable PDF of each R cheat sheet (2026-11-05), linked from the cheat-sheet index.
    - "resources/cheat-sheets/*.pdf"
    # The own-study walkthroughs' example coding sheet and finished scripts (guides 08 to 10, 2026-11-05): students download them.
    - "resources/examples/own-study-walkthrough/*"
    - "resources/examples/twitch-demo/*"
    # Self-hosted fonts (2026-11-14), loaded by course-layer.scss; licence files beside them.
    - "assets/fonts/*"

website:
  title: "V2V Hub"
  page-footer:
    center: "© 2026 Alex P. Leith. Text and course materials are licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) unless noted."
  # Quarto's own search is off (2026-11-14): tools/course-layer.ts builds a Pagefind index, which
  # can filter by course, and search.qmd shows it. The sidebar is gone too: each course home
  # (mc451/, mc501/) lists the weeks and the textbook parts the sidebar used to carry, and the
  # course bar under the navbar reaches the rest.
  search: false
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "MC 451"
        href: mc451/index.qmd
      - text: "MC 501"
        href: mc501/index.qmd
      - text: "Getting started"
        href: setup.qmd
      - text: "Help and resources"
        href: resources/index.qmd
      - text: "Search"
        href: search.qmd
    right:
      - text: "Textbook"
        href: https://aura-lab.siue.edu/v2v/
        target: _blank

format:
  html:
    # a11y-2026-07-30: light-only, dark theme removed. The dark bundle was
    # [darkly, custom-styling.scss] - the SAME stylesheet as light - and that
    # sheet hard-codes the warm-paper surface. Toggling therefore swapped only
    # Quarto's syntax palette and left pale dark tokens on light paper:
    # #f8f8f2 on #f1ede4 = 1.09:1, code effectively invisible, 321 axe
    # violations on a single workbook page. A real dark skin needs a dark
    # variant of every token in custom-styling.scss; until then light-only is
    # the honest state, and matches the book.
    theme: [cosmo, custom-styling.scss, syllabus-styling.scss, course-layer.scss]
    toc: true
    code-fold: false
    # Head script: which course's bar a shared page shows (2026-11-14). It replaced two preconnect
    # links to Google Fonts; the fonts are self-hosted now (custom-styling.scss).
    include-in-header: _includes/site-head.html
    # The site scripts (scrollable code and tables, the MC 451 / MC 501 edition switch, print
    # expansion) moved from inline text to a file on 2026-11-14, so the two deck index pages can
    # name the same file in their own front matter (decks/_metadata.yml would replace it otherwise).
    include-after-body: _includes/site-scripts.html
