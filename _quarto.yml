format:
  html:
    # a11y-2026-07-30: light-only, dark theme removed. The dark bundle was
    # [darkly, custom-styling.scss] - the SAME stylesheet as light - and that
    # sheet hard-codes the warm-paper surface. Toggling therefore swapped only
    # Quarto's syntax palette and left pale dark tokens on light paper:
    # #f8f8f2 on #f1ede4 = 1.09:1, code effectively invisible, 321 axe
    # violations on a single workbook page. A real dark skin needs a dark
    # variant of every token in custom-styling.scss; until then light-only is
    # the honest state, and matches the book.
    theme: [cosmo, custom-styling.scss, syllabus-styling.scss]
    toc: true
    code-fold: false
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    include-after-body:
      text: |
        <script>
        /* a11y-2026-07-30 scrollable-pre: overflowing <pre> blocks scroll
           horizontally, and with no focusable content a keyboard-only reader
           cannot scroll them, so the truncated code is unreachable (WCAG 2.1.1).
           tabindex="0" is the minimum that fixes it. We deliberately do NOT add
           role="region": that would put every code block in the landmark list
           and make the page markedly noisier to navigate by screen reader. */
        (function(){
          function mark(){
            document.querySelectorAll('pre').forEach(function(el){
              var scrolls = el.scrollWidth > el.clientWidth + 1 ||
                            el.scrollHeight > el.clientHeight + 1;
              if (scrolls && !el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
            });
          }
          if (document.readyState === 'loading')
            document.addEventListener('DOMContentLoaded', mark);
          else mark();
          window.addEventListener('load', mark);
          window.addEventListener('resize', mark);
          /* code-fold blocks measure 0 until opened */
          document.addEventListener('toggle', mark, true);
        })();
        </script>
        <script>
        /* edition-toggle-2026-08-12: MC 451 / MC 501 view switch. Shares the
           key and the origin with the textbook, so the choice follows the
           student across both sites. */
        (function(){
          var KEY = 'v2v-show-grad-ext';
          function apply(on){
            document.body.classList.toggle('show-grad-ext', on);
            var b = document.getElementById('v2v-edition-toggle');
            if(b){
              b.setAttribute('aria-pressed', on ? 'true' : 'false');
              /* State the CONSEQUENCE, not the setting. 'Graduate edition: off'
                 reads as a disabled feature; 'Showing MC 451' tells a graduate
                 student, in the words on their own registration, that they are
                 looking at the wrong course. */
              b.querySelector('.label').textContent =
                on ? 'Showing MC 501 (graduate)' : 'Showing MC 451 (undergraduate)';
            }
          }
          document.addEventListener('DOMContentLoaded', function(){
            /* edition-by-url-2026-08-29: a ?edition= parameter beats the stored
               choice and is then remembered. This is what lets a Blackboard link
               land a student in the right view without finding the button. Added
               after an MC 501 student followed MC 451 requirements, because the
               toggle defaults to OFF and nothing on the page said the view might
               not be theirs. Accepts course numbers as well as edition names,
               since a link is easier to read as ?edition=mc501. */
            var q = new URLSearchParams(window.location.search).get('edition');
            if (q === 'grad' || q === 'mc501') { localStorage.setItem(KEY, '1'); }
            if (q === 'ug'   || q === 'mc451') { localStorage.setItem(KEY, '0'); }
            var on = localStorage.getItem(KEY) === '1';
            var btn = document.createElement('button');
            btn.id = 'v2v-edition-toggle';
            btn.type = 'button';
            btn.title = 'Switch between the MC 451 and MC 501 view. Your choice is remembered across pages.';
            btn.innerHTML = '<span class="dot" aria-hidden="true"></span><span class="label"></span>';
            btn.addEventListener('click', function(){
              var now = !(localStorage.getItem(KEY) === '1');
              localStorage.setItem(KEY, now ? '1' : '0');
              apply(now);
            });
            document.body.appendChild(btn);
            apply(on);
          });
        })();
        </script>
        <script>
        /* syllabus-print-2026-08-17: force every <details> open for printing,
           then restore. Without this the collapsed policy blocks are simply
           absent from the printed syllabus and from Chrome's PDF export.
           CSS cannot do it: Chrome hides the content with content-visibility
           on a UA-level slot, not with display. */
        (function(){
          var opened = [];
          function expand(){
            opened = [];
            document.querySelectorAll('details:not([open])').forEach(function(d){
              opened.push(d); d.open = true;
            });
          }
          function restore(){ opened.forEach(function(d){ d.open = false; }); opened = []; }
          window.addEventListener('beforeprint', expand);
          window.addEventListener('afterprint', restore);
          /* Safari and headless Chrome drive print through matchMedia only. */
          if (window.matchMedia) {
            var mq = window.matchMedia('print');
            var onChange = function(m){ m.matches ? expand() : restore(); };
            if (mq.addEventListener) mq.addEventListener('change', onChange);
            else if (mq.addListener) mq.addListener(onChange);
          }
        })();
        </script>
