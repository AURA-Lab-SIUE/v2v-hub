project:
  type: website
  title: "V2V Hub"
  output-dir: docs
  render:
    - "*.qmd"
    - "modules/**/*.qmd"
    - "!modules/**/pokemon-practice.qmd"
    - "resources/*.qmd"
    - "workbook/*.qmd"
    - "chapters/*.qmd"
  resources:
    - "modules/04_analyst/pokemon-practice.qmd"

website:
  title: "V2V Hub"
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Syllabus"
        menu:
          - text: "MC 451 (Fall 2026)"
            href: syllabus.qmd
          - text: "MC 501 (Fall 2026)"
            href: mc501-syllabus.qmd
      - text: "Resources"
        href: resources/index.qmd
      - text: "Methods Vault"
        href: methods-vault.qmd
    right:
      - text: "Textbook"
        href: https://aura-lab-siue.github.io/v2v/
        target: _blank

  sidebar:
    - title: "V2V Hub"
      style: "docked"
      contents:
        - text: "Course Home"
          href: index.qmd
        - text: "How It Works"
          href: how-it-works.qmd
        - text: "---"

        - section: "Part I: Foundation"
          contents:
            - text: "Phase I: The Journalist"
              href: modules/01_journalist/index.qmd
            - text: "Ch 1 — The Science of Storytelling"
              href: https://aura-lab-siue.github.io/v2v/chapters/chapter01.html
            - text: "Ch 2 — The Open Workspace"
              href: https://aura-lab-siue.github.io/v2v/chapters/chapter02.html
            - text: "Ch 3 — Knowing and Knowing Well"
              href: https://aura-lab-siue.github.io/v2v/chapters/chapter03.html

        - section: "Part II: Planning"
          contents:
            - text: "Phase II: The Architect"
              href: modules/02_architect/index.qmd
