              href: https://aura-lab-siue.github.io/v2v/chapters/chapter04.html
            - text: "Ch 5 — Theory as a Lens"
              href: https://aura-lab-siue.github.io/v2v/chapters/chapter05.html
            - text: "Ch 6 — The Prospectus"
              href: https://aura-lab-siue.github.io/v2v/chapters/chapter06.html

        - section: "Part III: Operationalization"
          contents:
