on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: Build and deploy site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages@v4 caps timeout at 600000 ms (10 min) and rejects anything larger
          # ("timeout value is greater than the allowed maximum"), so the 1800000 set in #40 never
          # applied. The fix for the 2026-11-05 timeouts is a smaller artifact (decks/strip-unused-fonts.ts).
          timeout: 600000
